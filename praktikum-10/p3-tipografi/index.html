<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praktikum 10 - Tipografi</title>
  <style> 
  .judul-besar { font-size: 3rem; font-weight: 300; text-align: center; } 
  .pembuka     { font-size: 1.25rem; color: #6c757d; text-align: center; } 
  .label       { text-transform: uppercase; font-weight: 700; letter-spacing: .05em; 
} 
  .catatan     { font-size: .875em; font-style: italic; } 
  .nim         { font-family: monospace; } 
</style> 
</head>
<body>
<main class="container py-5"> 
  <h1 class="judul-besar">Selamat Datang di SIAKAD Mini</h1> 
  <p class="pembuka">Sistem informasi akademik Program Studi Teknik Informatika.</p> 
 
  <h2>Profil Mahasiswa</h2> 
  <p class="label">Nama</p> 
  <p>Rahmat Hidayat</p> 
  <p class="label">NIM</p> 
  <p class="nim">2410010123</p> 
  <p class="catatan">Data diperbarui otomatis setiap awal semester.</p> 
</main> 
</body>
</html>
